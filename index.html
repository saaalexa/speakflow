<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakFlow 2.3</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1c2941;background:#f3f6fc}*{box-sizing:border-box}body{margin:0;padding:16px 14px 95px}.wrap{max-width:620px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px}h1{font-size:25px;margin:0}small,.muted{color:#65738c}.panel{background:white;border-radius:20px;padding:18px;margin:13px 0;box-shadow:0 4px 18px #1523440b}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{flex:1;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid #dbe3f1;border-radius:14px;padding:16px;text-align:center;cursor:pointer}.tile strong{display:block;font-size:19px;margin:6px}button,select,input,textarea{font:inherit}button{border:0;border-radius:11px;padding:12px 14px;background:#e8eef9;color:#254779;cursor:pointer}button.primary{background:#284f91;color:white}button:disabled{opacity:.45}button.active{background:#284f91;color:white}input,textarea,select{width:100%;border:1px solid #cbd5e5;border-radius:10px;padding:11px;background:white;color:#1c2941}label{display:block;font-size:13px;color:#596981;margin:10px 0 5px}.phrase{font-size:26px;font-weight:650;text-align:center;line-height:1.5;margin:26px 0}.answer{font-size:21px;text-align:center;color:#264f8b;margin:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none!important}.status{font-size:13px;line-height:1.6;color:#53647e;margin:12px 0}.row{display:flex;align-items:center;gap:8px}.row>*{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f1f5fc;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:22px}.item{border-top:1px solid #e6ebf4;padding:12px 0}.item:first-child{border:0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#f3f6fcf5;padding:10px 14px max(12px,env(safe-area-inset-bottom));box-shadow:0 -3px 14px #15234415}.bottom>div{max-width:620px;margin:auto;display:flex;gap:8px}.bottom button{flex:1} .pill{display:inline-block;background:#e9f0fc;border-radius:30px;padding:5px 9px;font-size:12px}.warn{color:#986322}
</style></head><body><div class="wrap">
<header><div><h1>SpeakFlow <small>2.3</small></h1><small id="subtitle"></small></div><button onclick="show('settings')">⚙</button></header>
<div class="tabs"><button id="tab-home" onclick="show('home')"></button><button id="tab-train" onclick="show('train')"></button><button id="tab-add" onclick="show('add')"></button><button id="tab-stats" onclick="show('stats')"></button></div>
<section id="home" class="panel"><h2 id="homeTitle"></h2><div class="grid"><div class="tile" onclick="choose('en')">🇬🇧<strong>English</strong><small id="enCount"></small></div><div class="tile" onclick="choose('fr')">🇫🇷<strong>Français</strong><small id="frCount"></small></div></div><p class="status" id="homeInfo"></p></section>
<section id="train" class="panel hidden"><div class="row"><select id="target" onchange="choose(this.value)"><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option></select><select id="mode" onchange="restart()"><option value="due"></option><option value="hard"></option><option value="all"></option></select></div><div class="status" id="queueInfo"></div><div class="phrase" id="prompt"></div><div class="answer hidden" id="solution"></div><div class="status" id="feedback"></div><div class="actions"><button onclick="speakPrompt()">🔊 <span id="hearPrompt"></span></button><button onclick="listen()">🎙️ <span id="answerBtn"></span></button><button onclick="reveal()" id="revealBtn"></button></div><div class="actions" style="margin-top:9px"><button onclick="rate(0)" id="againBtn"></button><button onclick="rate(1)" id="goodBtn" class="primary"></button></div><p class="status" id="speechNote"></p></section>
<section id="add" class="panel hidden"><h2 id="addTitle"></h2><label id="langLabel"></label><select id="addTarget"><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option></select><label id="sourceLabel"></label><select id="sourceLang"><option value="ru">Русский</option><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option><option value="fa">فارسی</option></select><label id="phrasesLabel"></label><textarea id="batch" rows="5" placeholder="Одна фраза на строку"></textarea><div class="actions"><button onclick="dictate()">🎙️ <span id="dictateBtn"></span></button><button onclick="translateBatch()" class="primary" id="translateBtn"></button></div><p class="status" id="translateStatus"></p><div id="drafts"></div><button class="primary hidden" id="saveAll" onclick="saveDrafts()"></button></section>
<section id="stats" class="panel hidden"><h2 id="statsTitle"></h2><select id="statLang" onchange="renderStats()"><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option></select><div class="stats" id="statsGrid"></div><div id="statsList"></div></section>
<section id="settings" class="panel hidden"><h2 id="settingsTitle"></h2><label id="uiLabel"></label><select id="uiLang" onchange="setUI(this.value)"><option value="ru">Русский</option><option value="en">English</option><option value="fr">Français</option></select><p class="status" id="storageNote"></p><div class="actions"><button onclick="backup()" id="exportBtn"></button><button onclick="document.getElementById('importFile').click()" id="importBtn"></button></div><input id="importFile" class="hidden" type="file" accept=".json" onchange="restore(event)"></section>
</div><div class="bottom"><div><button onclick="previous()" id="prevBtn"></button><button onclick="next()" class="primary" id="nextBtn"></button></div></div>
<script>
const SEED=[{"id": "seed0", "ru": "Дай мне подумать об этом.", "en": "Let me think about it."}, {"id": "seed1", "ru": "Что ты делаешь?", "en": "What are you doing?"}, {"id": "seed2", "ru": "Я не это имела в виду.", "en": "I didn't mean it that way."}, {"id": "seed3", "ru": "Ты мог бы мне помочь?", "en": "Could you help me?"}, {"id": "seed4", "ru": "Я хочу попробовать ещё раз.", "en": "I want to try again."}, {"id": "seed5", "ru": "Покончить с этим.", "en": "Get it over with."}, {"id": "seed6", "ru": "Дай мне минуту.", "en": "Give me a minute."}, {"id": "seed7", "ru": "Мне нужно идти.", "en": "I have to go."}, {"id": "seed8", "ru": "Дай мне знать.", "en": "Let me know."}, {"id": "seed9", "ru": "Лучше поздно, чем никогда.", "en": "Better late than never."}];
const KEY='speakflow-v23';
const T={
ru:{home:'Мои языки',train:'Тренировка',add:'Добавить',stats:'Статистика',welcome:'Выбери язык',ready:'К повторению',all:'Все фразы',hard:'Повторить сложные',hear:'Слушать',answer:'Ответить',show:'Показать ответ',again:'Ещё повторить',good:'Знаю',prev:'Назад',next:'Далее',addTitle:'Добавить сразу несколько фраз',lang:'Изучаемый язык',source:'Язык исходных фраз',phrases:'Фразы — по одной на строку',dictate:'Надиктовать',translate:'Предложить перевод',save:'Сохранить все',statsTitle:'Мой прогресс',settings:'Настройки',ui:'Язык интерфейса',export:'Сохранить копию',import:'Восстановить копию',storage:'Данные хранятся в этом браузере. Для переноса на другой телефон используй резервную копию.',empty:'Пока нет фраз. Добавь свои!',correct:'Распознано',hint:'Оцени ответ: «Знаю» или «Ещё повторить».',done:'На сегодня всё! Можно повторить сложные или добавить фразы.',due:'Сегодня',learned:'Освоено',total:'Всего',failed:'Сложно',translationFail:'Не удалось получить перевод. Проверь интернет или впиши перевод вручную.',translationInfo:'Переводы предлагает внешний онлайн-сервис MyMemory. Проверь их перед сохранением. Голосовые функции зависят от браузера.',saved:'Фразы сохранены.',confirm:'Импортировать резервную копию? Текущий прогресс будет заменён.'},
en:{home:'My languages',train:'Practice',add:'Add phrases',stats:'Statistics',welcome:'Choose a language',ready:'Due for review',all:'All phrases',hard:'Review difficult',hear:'Listen',answer:'Speak',show:'Show answer',again:'Repeat soon',good:'I know it',prev:'Previous',next:'Next',addTitle:'Add several phrases',lang:'Learning language',source:'Input language',phrases:'One phrase per line',dictate:'Dictate',translate:'Suggest translations',save:'Save all',statsTitle:'My progress',settings:'Settings',ui:'Interface language',export:'Export backup',import:'Import backup',storage:'Progress is stored in this browser. Export a backup to move devices.',empty:'No phrases yet. Add some!',correct:'Recognized',hint:'Rate your answer.',done:'All done for today! Review difficult phrases or add new ones.',due:'Due today',learned:'Mastered',total:'Total',failed:'Difficult',translationFail:'Translation unavailable. Check internet or enter it manually.',translationInfo:'Translations use the external MyMemory service. Review before saving. Speech depends on your browser.',saved:'Phrases saved.',confirm:'Import backup? Existing progress will be replaced.'},
fr:{home:'Mes langues',train:'Exercice',add:'Ajouter',stats:'Statistiques',welcome:'Choisissez une langue',ready:'À réviser',all:'Toutes les phrases',hard:'Phrases difficiles',hear:'Écouter',answer:'Parler',show:'Voir la réponse',again:'À revoir',good:'Je connais',prev:'Précédent',next:'Suivant',addTitle:'Ajouter plusieurs phrases',lang:'Langue étudiée',source:'Langue de départ',phrases:'Une phrase par ligne',dictate:'Dicter',translate:'Proposer des traductions',save:'Tout enregistrer',statsTitle:'Mes progrès',settings:'Paramètres',ui:"Langue de l’interface",export:'Exporter',import:'Importer',storage:'Les données restent dans ce navigateur. Exportez une sauvegarde pour changer d’appareil.',empty:'Aucune phrase. Ajoutez-en !',correct:'Reconnu',hint:'Évaluez votre réponse.',done:'Terminé pour aujourd’hui !',due:"Aujourd’hui",learned:'Maîtrisées',total:'Total',failed:'Difficiles',translationFail:'Traduction indisponible. Vérifiez Internet ou saisissez-la.',translationInfo:'Traduction via le service externe MyMemory. Vérifiez avant de sauvegarder.',saved:'Phrases enregistrées.',confirm:'Importer ? Les données actuelles seront remplacées.'}};
const $=id=>document.getElementById(id);const now=()=>Date.now();
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!db||!Array.isArray(db.cards))db={ui:'ru',target:'en',cards:SEED.map(c=>({...c,lang:'en',level:0,due:0,tries:0,miss:0,seconds:[],hints:0}))};
try{const old=JSON.parse(localStorage.getItem('speakflow-activation-history-v1')||'{}');db.cards.forEach(c=>{if(c.lang==='en'&&old[c.en]&&c.tries===undefined){let attempts=old[c.en];c.tries=attempts.length;c.miss=attempts.filter(a=>!a.correct).length;c.seconds=attempts.filter(a=>a.correct).map(a=>a.seconds)}})}catch(e){}
db.cards.forEach(c=>{c.level??=0;c.due??=0;c.tries??=0;c.miss??=0;c.seconds??=[]});
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function t(k){return (T[db.ui]||T.ru)[k]||k}
let screen='home',queue=[],pos=0,started=0,revealed=false,recognized='',drafts=[];
function show(s){screen=s;['home','train','add','stats','settings'].forEach(id=>$(id).classList.toggle('hidden',id!==s));['home','train','add','stats'].forEach(id=>$('tab-'+id).classList.toggle('active',id===s));if(s==='train')renderTrain();if(s==='stats')renderStats();if(s==='home')renderHome()}
function setUI(lang){db.ui=lang;save();renderUI();show(screen)}
function renderUI(){document.documentElement.lang=db.ui;$('uiLang').value=db.ui;let ids={home:'tab-home',train:'tab-train',add:'tab-add',stats:'tab-stats',welcome:'homeTitle',hear:'hearPrompt',answer:'answerBtn',show:'revealBtn',again:'againBtn',good:'goodBtn',prev:'prevBtn',next:'nextBtn',addTitle:'addTitle',lang:'langLabel',source:'sourceLabel',phrases:'phrasesLabel',dictate:'dictateBtn',translate:'translateBtn',save:'saveAll',statsTitle:'statsTitle',settings:'settingsTitle',ui:'uiLabel',export:'exportBtn',import:'importBtn',storage:'storageNote'};Object.entries(ids).forEach(([k,id])=>$(id).textContent=t(k));$('mode').options[0].text=t('ready');$('mode').options[1].text=t('hard');$('mode').options[2].text=t('all');$('speechNote').textContent=t('hint');$('translateStatus').textContent=t('translationInfo');$('subtitle').textContent='Speech · Spaced repetition';renderHome()}
function choose(lang){db.target=lang;save();$('target').value=lang;$('addTarget').value=lang;$('statLang').value=lang;restart();show('train')}
function renderHome(){['en','fr'].forEach(l=>{$(l+'Count').textContent=db.cards.filter(c=>c.lang===l).length+' '+t('total').toLowerCase()});$('homeInfo').textContent=t('storage')}
function candidates(){let a=db.cards.filter(c=>c.lang===db.target);let m=$('mode').value;if(m==='due')a=a.filter(c=>c.due<=now());if(m==='hard')a=a.filter(c=>c.miss>0||c.level<2);return a.sort((x,y)=>(x.due-y.due)||((y.miss||0)-(x.miss||0)))}
function restart(){queue=candidates();pos=0;started=now();revealed=false;recognized='';renderTrain()}
function current(){return queue[pos]}
function renderTrain(){if(screen!=='train')return;$('target').value=db.target;$('queueInfo').textContent=queue.length?`${Math.min(pos+1,queue.length)} / ${queue.length}`:'';let c=current();$('prompt').textContent=c?(c.ru||c.en||c.fr):t('done');$('solution').textContent=c?(c[db.target]||''):'';$('solution').classList.toggle('hidden',!revealed);$('feedback').textContent=recognized;$('revealBtn').disabled=!c;$('againBtn').disabled=!c;$('goodBtn').disabled=!c}
function next(){if(screen!=='train'){show('train');return}if(pos<queue.length)pos++;started=now();revealed=false;recognized='';renderTrain()}
function previous(){if(screen!=='train'){show('home');return}pos=Math.max(0,pos-1);started=now();revealed=false;recognized='';renderTrain()}
function reveal(){revealed=true;renderTrain()}
function say(text,lang){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=({ru:'ru-RU',en:'en-US',fr:'fr-FR',ar:'ar-SA',fa:'fa-IR'})[lang]||lang;u.rate=.9;speechSynthesis.speak(u)}
function speakPrompt(){let c=current();if(c)say(c.ru||c.en,'ru')}
function recognizer(lang,callback){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Speech recognition is not supported in this browser.');return}let r=new R();r.lang=({ru:'ru-RU',en:'en-US',fr:'fr-FR',ar:'ar-SA',fa:'fa-IR'})[lang]||lang;r.onresult=e=>callback(e.results[0][0].transcript);r.onerror=e=>{$('feedback').textContent=e.error};try{r.start()}catch(e){alert(e.message)}}
function listen(){if(!current())return;recognizer(db.target,txt=>{recognized=t('correct')+': '+txt;revealed=true;renderTrain()})}
function rate(ok){let c=current();if(!c)return;c.tries++;if(ok){c.level=Math.min(6,c.level+1);let days=[0,1,3,7,14,30,60][c.level];c.due=now()+days*86400000;c.seconds.push(Math.round((now()-started)/100)/10)}else{c.level=0;c.miss++;c.due=now()+10*60000}save();next()}
function renderStats(){let l=$('statLang').value,a=db.cards.filter(c=>c.lang===l),due=a.filter(c=>c.due<=now()).length,master=a.filter(c=>c.level>=5).length,hard=a.filter(c=>c.miss>0).length;$('statsGrid').innerHTML=[[t('total'),a.length],[t('due'),due],[t('learned'),master]].map(([x,y])=>`<div class="stat"><strong>${y}</strong>${x}</div>`).join('');$('statsList').replaceChildren();a.sort((x,y)=>x.level-y.level).forEach(c=>{let d=document.createElement('div');d.className='item';let title=document.createElement('strong');title.textContent=c[l]||'';let sub=document.createElement('div');sub.className='status';sub.textContent=`${c.ru||''} · ${t('failed')}: ${c.miss} · ${t('learned')}: ${c.level}/6`;d.append(title,sub);$('statsList').append(d)})}
function dictate(){let lang=$('sourceLang').value;recognizer(lang,txt=>{$('batch').value+=($('batch').value.trim()?'\n':'')+txt})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function translateOne(q,from,to){if(from===to)return q;let u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+encodeURIComponent(from+'|'+to);let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(j.responseStatus!==200||!j.responseData?.translatedText)throw Error('Translation unavailable');return j.responseData.translatedText}
async function translateBatch(){let lines=$('batch').value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,30),from=$('sourceLang').value,to=$('addTarget').value;drafts=[];$('translateStatus').textContent='…';for(let i=0;i<lines.length;i++){let input=lines[i],out='';try{out=await translateOne(input,from,to)}catch(e){}let ru=from==='ru'?input:'',target=from===to?input:out;try{if(!ru)ru=await translateOne(input,from,'ru')}catch(e){}drafts.push({ru,target,lang:to});$('translateStatus').textContent=(i+1)+' / '+lines.length}renderDrafts();$('translateStatus').textContent=t('translationInfo')}
function renderDrafts(){$('drafts').replaceChildren();drafts.forEach((d,i)=>{let box=document.createElement('div');box.className='item';let a=document.createElement('input');a.value=d.ru;a.placeholder='Русский';a.oninput=()=>d.ru=a.value;let b=document.createElement('input');b.value=d.target;b.placeholder=d.lang==='en'?'English':'Français';b.oninput=()=>d.target=b.value;box.append(a,b);$('drafts').append(box)});$('saveAll').classList.toggle('hidden',!drafts.length)}
function saveDrafts(){let valid=drafts.filter(x=>x.ru.trim()&&x.target.trim());valid.forEach(d=>db.cards.push({id:'custom-'+now()+'-'+Math.random().toString(36).slice(2),ru:d.ru.trim(),[d.lang]:d.target.trim(),lang:d.lang,level:0,due:0,tries:0,miss:0,seconds:[]}));save();drafts=[];renderDrafts();$('batch').value='';$('translateStatus').textContent=t('saved')+' '+valid.length;restart();renderHome()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SpeakFlow-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){let f=e.target.files[0];if(!f)return;f.text().then(s=>{let d=JSON.parse(s);if(!Array.isArray(d.cards))throw Error('Invalid backup');if(confirm(t('confirm'))){db=d;save();renderUI();restart();show('home')}}).catch(err=>alert(err.message));e.target.value=''}
$('sourceLang').value='ru';$('target').value=db.target;$('addTarget').value=db.target;$('statLang').value=db.target;renderUI();restart();show('home');
</script></body></html>
